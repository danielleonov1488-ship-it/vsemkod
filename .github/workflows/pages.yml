name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/src/**'
      - 'app/design/**'
      - 'app/package*.json'
      - 'app/vite.web.config.ts'
      - 'catalog-bot/data/catalog.json'
      - 'catalog-bot/data/benchmarks.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Update catalog']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build browser harness
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run build:web
      - name: Assemble static site
        run: |
          mkdir -p _site
          for item in site/*; do
            if [ "${item%.md}" = "$item" ] && [ "$item" != "site/dev" ] && [ "$item" != "site/harness" ]; then
              cp -R -- "$item" _site/
            fi
          done
          cp -R site/harness _site/harness
          cp catalog-bot/data/catalog.json catalog-bot/data/changes.json _site/
          if [ -f catalog-bot/data/benchmarks.json ]; then
            cp catalog-bot/data/benchmarks.json _site/
          fi
          printf '%s\n' 'vsemkod.ru' > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

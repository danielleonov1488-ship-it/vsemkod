appId: ru.vsemkod.app
productName: vsemkod
icon: build/icon.png
files:
  - out/**
  - package.json
extraResources:
  - from: resources/catalog.json
    to: catalog.json
  - from: resources/benchmarks.json
    to: benchmarks.json
  - from: resources/connectors.json
    to: connectors.json
  - from: resources/skills-catalog
    to: skills-catalog
  - from: resources/tray
    to: tray
  - from: tests/fixtures/voice-en.wav
    to: voice-benchmark.wav
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
publish:
  provider: github
  owner: danielleonov1488-ship-it
  repo: vsemkod
  releaseType: draft
win:
  artifactName: vsemkod-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: resources/engine/win32-${arch}
      to: engine/win32-${arch}
      filter: [opencode.exe]
    - from: resources/voice/win32-${arch}
      to: voice/win32-${arch}
      filter: ["*.node", "cli/**", "!cli/sha256.json"]
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
mac:
  artifactName: vsemkod-macos-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip нужен electron-updater для latest-mac.yml (проверка новых версий).
    - target: zip
      arch: [arm64, x64]
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: vsemkod использует микрофон для диктовки сообщений.
  notarize: false
  extraResources:
    - from: resources/engine/darwin-${arch}
      to: engine/darwin-${arch}
      filter: [opencode]
    - from: resources/voice/darwin-${arch}
      to: voice/darwin-${arch}
      filter: ["*.node"]
linux:
  artifactName: vsemkod-linux-${arch}.${ext}
  category: Development
  target:
    - target: AppImage
      arch: [x64]
  extraResources:
    - from: resources/engine/linux-${arch}
      to: engine/linux-${arch}
      filter: [opencode]
    - from: resources/voice/linux-${arch}
      to: voice/linux-${arch}
      filter: ["*.node", "cli/**", "!cli/sha256.json"]

<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F1112">
  <meta name="robots" content="noindex">
  <title>Страница не найдена · vsemkod</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem("vsemkod-theme"); } catch {}
      if (theme !== "light") theme = "dark";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#F5F4F0" : "#0F1112";
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap not-found">
    <a class="brand" href="/" aria-label="vsemkod, главная">
      <img src="/assets/logo.svg" width="33" height="33" alt="">
      <span>vsem<span class="brand-accent">kod</span></span>
    </a>
    <h1>Страница не найдена</h1>
    <p>Ошибка 404</p>
    <a class="button button-primary" href="/">На главную</a>
  </main>
</body>
</html>
